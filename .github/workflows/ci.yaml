name: CI

on:
  workflow_call:
    inputs:
      fallback-sha:
        description: Provide sha that should be used if no success found
        type: string
        required: false
      rebuild:
        type: boolean
        default: false
        required: false
        description: rebuild all projects
    secrets:
      CODECOV_TOKEN:
        required: false
    config:
      required: false
      description: "allows passing configuration options.  Should be supplied as stringified json object"
      default: "{}"
  # push:
  #   branches-ignore:
  #     - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    # validate commit message
  determine_targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # this could be replaced by getting the most recent tag, then
        # getting the commits between the last tag and the current commit
      - name: Get commits between last success and this commit
        uses: nrwl/nx-set-shas@v4
        with:
          fallback-sha: ${{ inputs.fallback-sha }}
        # fallback-sha: 89070420373e8769feafe1e70f4d5d4f5f81cfd0
        # workflow-id: cd.yaml

      - uses: goraxe-org/workflows/actions/get_targets@main
        id: targets
        with:
          all: ${{ inputs.rebuild }}
      - run: |
          echo "${{ steps.targets.outputs.targets }}"

  test:
    runs-on: ubuntu-latest
    needs: determine_targets
    strategy:
      matrix:
        target: ${{ fromJSON(needs.determine_targets.outputs.targets) }}
      fail-fast: false
    container: ${{ fromJSON(inputs.config)[matrix.target]['container'] || null }}
    steps:
      - uses: actions/checkout@v4
      - uses: goraxe-org/workflows/actions/test@main
        with:
          target: ${{ matrix.target }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
