name: Build Docker
description: Build docker container
inputs:
  registry:
    description: "registry to push containers to"
    required: false
    default: ghcr.io
  image_name:
    description: "name of the image"
    required: false
    default: ${{ github.repository }}
  context:
    description: "context for the docker build"
    required: false
  file:
    description: "location of the docker file default {context}/Dockerfile"
    required: false
  push:
    description: "push the image"
    required: false
    default: "true"
  upload:
    description: "upload the image as a build artifiact"
    required: false
    default: "false"
  release-version:
    description: "version to tag images with"
    required: false
  cosign_password:
    required: false
    description: cosign password
  cosign_private_key:
    required: false
    description: cosign private key
outputs:
  build:
    description: The output from the build step
    value: ${{ steps.build.outputs.metadata }}
  meta:
    description: The output from the build step
    value: ${{ steps.meta.outputs.json }}
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.7.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to the Container registry
      uses: docker/login-action@327cd5a69de6c009b9ce71bce8395f28e651bf99
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
    - name: "Extract metadata (tags, labels) for Docker"
      id: meta
      uses: docker/metadata-action@8e1d5461f02b7886d3c1a774bfbd873650445aa2
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}
        tags: |
          type=schedule
          type=semver,pattern={{version}},value=${{ inputs.release-version}}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release-version }}
          type=semver,pattern={{major}},value=${{ inputs.release-version }}
          type=ref,event=branch
          type=ref,event=pr
          type=sha,format=long
    - id: base_name
      shell: bash
      run: echo "name=$(basename ${{ inputs.image_name }})" >> $GITHUB_OUTPUT

    - name: "Build Docker image"
      id: build
      uses: docker/build-push-action@v6.15.0
      with:
        outputs: type=oci,dest=${{ runner.temp }}/${{ steps.base_name.outputs.name}}.tar
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.image_name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
        sbom: true
        provenance: true
    - run: |
        echo "uploading artifact"
        ls -la  ${{ runner.temp }}
      shell: bash
      if: ${{ inputs.upload == true  }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: ${{ inputs.upload == true  }}
      with:
        name: docker-${ {steps.base_name.outputs.name }}
        path: ${{ runner.temp }}/${{ steps.base_name.outputs.name }}.tar
        retention-days: 1

    - name: "Sign image with a key"
      if: ${{ inputs.push == true && inputs.cosign_private_key && inputs.cosign_password }}
      shell: bash
      run: |
        images=""
        for tag in ${TAGS}; do
          if [[ ! -z $DIGEST ]]; then
            images+="${tag}@${DIGEST} "
          else
            images+="${tag} "
          fi
        done
        # do not upload to transparency log
        # shellcheck disable=SC2086
        cosign sign --tlog-upload=false --yes --key env://COSIGN_PRIVATE_KEY ${images}
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.build.outputs.digest }}
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign_private_key }}
        COSIGN_PASSWORD: ${{ inputs.cosign_password }}
