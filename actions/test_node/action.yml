name: Test Node
description: Test Node
inputs:
  target:
    description: "directory to run tests in"
    required: true
  CODECOV_TOKEN:
    required: false
    description: "the token for codecov"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      name: Install pnpm
      with:
        run_install: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          ${{ inputs.target }}/pnpm-lock.yaml
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - name: Install dependencies (root)
      shell: bash
      run: pnpm install
    - name: Install dependencies (${{ inputs.target }})
      working-directory: ${{ inputs.target}}
      shell: bash
      run: pnpm install
    - name: Run tests
      working-directory: ${{ inputs.target}}
      shell: bash
      run: |
        pnpm test
        ls -l || true
        ls -l ${{ inputs.target }}/coverage || true

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ inputs.CODECOV_TOKEN }}

    - name: Upload coverage to Codecov
      if: ${{ inputs.CODECOV_TOKEN }}
      uses: codecov/codecov-action@v4
      with:
        verbose: true
        token: ${{ inputs.CODECOV_TOKEN }}
        directory: ${{ inputs.target }}/coverage
