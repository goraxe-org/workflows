name: Test
description: Test
inputs:
  target:
    description: "directory to run tests in"
    required: true
  CODECOV_TOKEN:
    required: false
    description: "the token for codecov"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - id: test_system
      working-directory: ${{ inputs.target }}
      shell: bash
      run: |
        if [ -f "Cargo.toml" ]; then
          echo "lang=rust" >> $GITHUB_OUTPUT
        elif [ -f "package.json" ]; then
          echo "lang=node" >> $GITHUB_OUTPUT
        elif [ -f "go.mod" ]; then
          echo "lang=golang" >> $GITHUB_OUTPUT
        fi
    - if: ${{ steps.test_system.outputs.lang == 'rust' }}
      uses: goraxe-org/workflows/actions/test_rust@main
      with:
        target: ${{ inputs.target }}
        CODECOV_TOKEN: ${{ inputs.CODECOV_TOKEN }}
    - if: ${{ steps.test_system.outputs.lang == 'node' }}
      uses: goraxe-org/workflows/actions/test_node@main
      with:
        target: ${{ inputs.target }}
        CODECOV_TOKEN: ${{ inputs.CODECOV_TOKEN }}
    - if: ${{ steps.test_system.outputs.lang == 'golang' }}
      uses: goraxe-org/workflows/actions/test_golang@main
      with:
        target: ${{ inputs.target }}
        CODECOV_TOKEN: ${{ inputs.CODECOV_TOKEN }}
