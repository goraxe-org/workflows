name: Test Rust
description: Test Rust
inputs:
  target:
    description: "directory to run tests in"
    required: true
  CODECOV_TOKEN:
    required: false
    description: "the token for codecov"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - id: base_name
      shell: bash
      run: echo "name=$(basename ${{ inputs.target }})" >> $GITHUB_OUTPUT
    - uses: actions-rust-lang/setup-rust-toolchain@v1.12.0
      with:
        rustflags: "-D warnings -C instrument-coverage"
        #toolchain: nightly
        cache-workspaces: |
          ${{ inputs.target }} -> target
        cache-shared-key: ${{ github.repository }}-${{ steps.base_name.outputs.name}}
    - uses: taiki-e/install-action@nextest
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Generate code coverage
      working-directory: ${{ inputs.target }}
      shell: "bash"
      run: |
        mkdir -p coverage/
        CONF_FILE=".cargo/cov.json"
        if [[ -e ${CONF_FILE} ]]; then
          COV_ARGS=$(cat ${CONF_FILE} | jq 'to_entries | reduce .[] as {$key, $value}  (null; . + ["--" + $key + " " + $value ] ) | join(" ")' -r)
        fi
        #export RUSTFLAGS="-Zinstrument-coverage ${RUSTFLAGS}"
        echo "test"
        cargo llvm-cov nextest ${COV_ARGS} --package $(basename  ${{ inputs.target }}) --codecov --output-path coverage/codecov.json

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ inputs.CODECOV_TOKEN }}
        directory: ${{ inputs.target }}/target/nextest/default

    - # https://kubernetes.io/docs/concepts/configuration/configmap/me: Codecov
      # You may pin to the exact commit or the version.
      # uses: codecov/codecov-action@81cd2dc8148241f03f5839d295e000b8f761e378
      uses: codecov/codecov-action@v5
      with:
        # Repository upload token - get it from codecov.io. Required only for private repositories
        # token:  # optional
        # Specify whether the Codecov output should be verbose
        token: ${{ inputs.CODECOV_TOKEN }}
        slug: ${{ github.repository }}
        verbose: true
        # directory: coverage
        directory: ${{ inputs.target }}/coverage
