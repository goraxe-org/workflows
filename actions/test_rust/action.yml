name: Test Rust
description: Test Rust
inputs:
  target:
    description: "directory to run tests in"
    required: true
  CODECOV_TOKEN:
    required: false
    description: "the token for codecov"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
    - uses: taiki-e/install-action@nextest
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Generate code coverage
      working-directory: ${{ inputs.target }}
      shell: "bash"
      run: |
        mkdir -p coverage/
        export RUSTFLAGS="-Zinstrument-coverage ${RUSTFLAGS}"
        echo "build"
        cargo build
        echo "test"
        cargo llvm-cov nextest --package $(basename  ${{ inputs.target }}) --codecov --output-path coverage/codecov.json
        ls -lR

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ inputs.CODECOV_TOKEN }}
        directory: ${{ inputs.target }}/target/nextest/default

    - # https://kubernetes.io/docs/concepts/configuration/configmap/me: Codecov
      # You may pin to the exact commit or the version.
      # uses: codecov/codecov-action@81cd2dc8148241f03f5839d295e000b8f761e378
      uses: codecov/codecov-action@v5
      with:
        # Repository upload token - get it from codecov.io. Required only for private repositories
        # token:  # optional
        # Specify whether the Codecov output should be verbose
        token: ${{ inputs.CODECOV_TOKEN }}
        slug: ${{ github.repository }}
        verbose: true
        # directory: coverage
        directory: ${{ inputs.target }}/coverage
